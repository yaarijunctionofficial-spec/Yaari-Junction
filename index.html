<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaari Junction - Dosti Da Adda</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff3366">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,Arial;background:#0f172a;color:#fff}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,#1e3c72,#2a5298);position:relative;padding-bottom:70px}
.header{background:rgba(0,0,0,0.4);padding:16px;text-align:center;font-size:22px;font-weight:900}
.tab{display:none;padding:16px}
.tab.show{display:block}
.card{background:rgba(255,255,255,0.12);padding:16px;border-radius:16px;margin-top:20px}
input{width:100%;padding:14px;border-radius:28px;border:none;font-size:16px;margin:10px 0}
.btn{width:100%;padding:14px;border-radius:28px;border:none;background:#ff9f43;color:#000;font-weight:800;font-size:17px;cursor:pointer}
#chatBox{height:58vh;overflow:auto;background:rgba(0,0,0,0.25);border-radius:16px;padding:12px}
.me{text-align:right;margin:8px 0}
.me span{background:#ff9f43;color:#000;padding:10px 14px;border-radius:18px 18px 4px 18px;display:inline-block;max-width:82%}
.bot{text-align:left;margin:8px 0}
.bot span{background:#fff;color:#111;padding:10px 14px;border-radius:18px 18px 18px 4px;display:inline-block;max-width:82%}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;display:flex;background:rgba(0,0,0,0.9)}
.nav div{flex:1;text-align:center;padding:14px 0;cursor:pointer;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div class="app">
<div class="header">Yaari Junction 💬</div>
<div id="tab-login" class="tab show">
<div class="card">
<h2>Welcome Yaar! 🙏</h2>
<input id="userName" placeholder="Tuhada naam likho...">
<button class="btn" onclick="doLogin()">Shuru Karo 🚀</button>
</div>
</div>
<div id="tab-chat" class="tab">
<div id="chatBox"><div class="bot"><span>Sat Sri Akal Bai! Ki haal aa? 🙏</span></div></div>
<div style="display:flex;gap:8px;margin-top:10px"><input id="chatIn" placeholder="Message likho..." onkeypress="if(event.key==='Enter')sendChat()"><button class="btn" onclick="sendChat()" style="width:85px">Send</button></div>
</div>
<div id="tab-home" class="tab"><h2 id="dashName">Yaar List</h2><div id="yaarList"></div><div class="card"><input id="newYaarName" placeholder="Nava yaar"><button class="btn" onclick="addYaar()">Add Yaar +</button></div></div>
