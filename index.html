<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yaari Junction</title>
<style>
body{margin:0;font-family:sans-serif;background:linear-gradient(to bottom,#0f172a,#1e3a8a);min-height:100vh;color:white}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center}
.card{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);padding:30px;border-radius:20px;max-width:380px;width:100%}
.btn{background:#fdba74;color:black;font-weight:bold;padding:12px 30px;border-radius:999px;border:none;cursor:pointer;margin-top:20px;width:100%}
input{width:100%;padding:12px;border-radius:12px;border:none;margin:6px 0;background:rgba(255,255,255,0.2);color:white;box-sizing:border-box}
.hidden{display:none}
.link{color:#fdba74;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div id="home" class="center">
<h1 style="font-size:45px;color:#fb923c;margin:0">Yaari Junction</h1>
<p style="opacity:0.7">Dosti Da Nava Adda - Punjab</p>
<div class="card" style="margin-top:30px">
<h2>Sat Sri Akal Yaar! 🙏</h2>
<p style="opacity:0.7">Teri Yaari Junction app hun live hai!</p>
<button class="btn" onclick="document.getElementById('home').classList.add('hidden');document.getElementById('login').classList.remove('hidden')">Yaari Check Karo</button>
</div>
</div>
<div id="login" class="center hidden">
<div class="card">
<h2>Welcome Back Yaar! 🙏</h2>
<p style="opacity:0.6;font-size:14px">Yaari Junction - Dosti Da Nava Adda</p>
<input placeholder="Tera Naam / Username">
<input placeholder="Email">
<input type="password" placeholder="Password">
<button class="btn">Login Karo</button>
<p style="font-size:14px;color:rgba(255,255,255,0.7);margin-top:15px">Nava yaar? <span class="link">Signup</span></p>
<p class="link" style="font-size:14px;margin-top:10px" onclick="document.getElementById('login').classList.add('hidden');document.getElementById('home').classList.remove('hidden')">← Piche Jao</p>
</div>
</div>
</body>
</html>
